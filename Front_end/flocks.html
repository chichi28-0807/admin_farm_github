<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flocks and Batches</title>
</head>
<body>
  <main class="content-area">
    <section class="page-header">
      <div>
        <h1 class="page-title">Flocks &amp; Batches</h1>
        <p class="page-subtitle">Monitor active poultry batches and house assignments.</p>
      </div>
    </section>

    <section class="kpi-grid">
      <article class="kpi-card">
        <h2 class="kpi-label">House 01</h2>
        <div class="kpi-value">1,000 <small>birds</small></div>
        <footer class="kpi-footer"><span>Batch #1</span><span class="pill pill-success">Active</span></footer>
      </article>
      <article class="kpi-card">
        <h2 class="kpi-label">House 02</h2>
        <div class="kpi-value">860 <small>birds</small></div>
        <footer class="kpi-footer"><span>Batch #2</span><span class="pill pill-success">Active</span></footer>
      </article>
    </section>
  </main>
</body>
</html>
